<!DOCTYPE html>
<!-- impacto.html | Responsable: Persona 2 (diseño) -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuestro impacto | Comedor Comunitario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <script src="js/layout.js" defer></script>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="flex flex-col min-h-screen bg-[#FDF6E9] font-['Nunito'] text-[#3D2D28]">
  <header id="encabezado"></header>

  <main class="flex-1 overflow-x-clip">
  <section class="mx-auto max-w-5xl px-6 py-12 sm:py-16 lg:px-8">
    <h1 class="font-titulo text-5xl leading-[1.05]">Galería</h1>
    <p class="mt-4 max-w-prose text-lg">Aquí puedes encontrar todas las invitaciones que han sido creadas hasta la fecha. Toca alguna para verla en grande y desplázate con los botones o teclas.</p>
    <ul id="galeria-invitaciones" role="list" class="mt-10 grid grid-cols-2 gap-5 sm:gap-8 md:grid-cols-3 lg:grid-cols-4">
      <li class="col-span-full text-lg font-bold">Cargando invitaciones…</li>
    </ul>
  </section>
</main>

  <footer id="pie"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/invitaciones.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/impacto.js"></script>
</body>
</html>
