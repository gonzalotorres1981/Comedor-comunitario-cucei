<!DOCTYPE html>
<!-- impacto.html | Responsable: Persona 2 (diseño) -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuestro impacto | Comedor Comunitario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <script src="js/layout.js" defer></script>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="flex flex-col min-h-screen bg-[#FDF6E9] font-['Nunito'] text-[#3D2D28]">
  <header id="encabezado"></header>

  <main>
    <section class="max-w-5xl mx-auto px-4 pt-12 pb-16 grid gap-12 md:grid-cols-[1.3fr_1fr] items-center">
      <div><h1 class="font-titulo text-5xl leading-[1.05]">Ups, trabajando en ello...</h1>
      <p class="mt-4 max-w-prose text-lg">Esta página es parte de un proyecto que sigue en pruebas, agradecemos su paciencia.</p>
      </div>
      
      <aside class="relative mx-auto w-full min-w-[280px] max-w-sm rotate-[-2deg] shrink-0 mt-4 lg:mt-0" aria-label="Mona china">
        <span aria-hidden="true" class="absolute -top-4 left-1/2 -translate-x-1/2 h-8 w-32 bg-[#EADDB8] rotate-[3deg]"></span>
        <div class="rounded-3xl border-[3px] border-tinta bg-papel p-8 shadow-[8px_8px_0_#3D2D28]">
          <img src="img/monachina.png" alt="Mona china jsjsjs" decoding="async"
          class="aspect-[5/5] w-full rounded-xl object-cover">
        </div>
      </aside>
    <!-- Dashboard de impacto con gráficas de Chart.js (platos servidos, agua, beneficiados, horas de voluntariado).
       Diseño: Persona 2. Gráficas (js/impacto.js): Persona 5. -->
  </main>

  <footer id="pie"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/impacto.js"></script>
</body>
</html>
